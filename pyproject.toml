[project]
name = "weld-defect-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "grad-cam>=1.5.5",
    "lxml>=6.0.4",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "opencv-contrib-python>=4.13.0.92",
    "opencv-python>=4.13.0.92",
    "opencv-python-headless>=4.13.0.92",
    "pandas>=2.0",
    "pillow>=12.0.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.4",
    "seaborn>=0.13",
    "segmentation-models-pytorch>=0.5.0",
    "streamlit>=1.56.0",
    "timm>=1.0.26",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.66.5",
    "uvicorn>=0.44.0",
]
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
